name: build-core-optix

on:
  push:
    paths: ["core/**", "addon/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  windows:
    # windows-2022 ships Visual Studio 2022 (MSVC 19.4x), which CUDA 12.5
    # officially supports. windows-latest (VS2026) is too new for CUDA 12.5's
    # nvcc/STL and breaks compilation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit (nvcc)
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.5.0'

      # OptiX 9.0 headers come from NVIDIA/optix-dev (headers only; optix.64.dll
      # is loaded at runtime from the NVIDIA driver, so nothing to ship). Use a
      # sparse checkout of just include/ (authenticated, avoids the flaky
      # archive-zip download).
      - name: Fetch OptiX 9.0 headers (NVIDIA/optix-dev)
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/optix-dev
          ref: v9.0.0
          path: optix_dev
          sparse-checkout: include
          sparse-checkout-cone-mode: false

      - name: Configure
        run: cmake -S core -B build -A x64 -DOPTIX_INCLUDE_DIR="$PWD/optix_dev/include"

      - name: Build
        run: cmake --build build --config Release

      - name: Dump exe imports
        if: always()
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $db = Get-ChildItem (Join-Path $install "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe | Select-Object -First 1
          if ($db) { & $db.FullName /dependents build/Release/Rstr2Core.exe } else { "dumpbin not found" }

      - name: Smoke run
        shell: cmd
        run: |
          build\Release\Rstr2Core.exe --ci & echo EXITCODE=%ERRORLEVEL%

      - uses: actions/upload-artifact@v4
        with:
          name: Rstr2Core-win64
          path: |
            build/Release/Rstr2Core.exe
            build/Release/optix_kernels.ptx
